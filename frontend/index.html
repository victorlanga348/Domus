<!doctype html>
<html lang="pt-PT" class="bg-[#F4F9F7] min-h-full min-h-[100dvh]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DOMUS</title>
    <meta name="description" content="DOMUS: Sistema de governança, tarefas e convivência residencial compartilhada." />

    <!-- Favicon & Identidade Visual Oficial DOMUS -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifesto PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Configurações para iOS (Safari Standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DOMUS" />

    <!-- Prevenção Universal de Tela Preta no Mobile / Forçar Modo Claro no Canvas do SO -->
    <meta name="color-scheme" content="light" />
    <!-- Cor de Tema da Barra de Status / Navegador -->
    <meta name="theme-color" content="#F4F9F7" />

    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        background-color: #F4F9F7 !important;
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        color-scheme: light;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes domus-sk-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.45; }
      }
      .domus-sk-pulse {
        animation: domus-sk-pulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .domus-sk-pulse {
          animation: none !important;
          opacity: 0.7 !important;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F4F9F7] font-['Inter',sans-serif] text-[#131e1d] antialiased min-h-full min-h-[100dvh]" style="background-color: #F4F9F7 !important;">
    <div id="root" class="bg-[#F4F9F7] min-h-full min-h-[100dvh] flex flex-col" style="background-color: #F4F9F7 !important;">
      <!-- Skeleton de Inicialização Imediata (Renderizado a 0ms no Mobile antes do bundle JS carregar) -->
      <div style="width: 100%; min-height: 100dvh; background-color: #F4F9F7; display: flex; flex-direction: column;" aria-label="Inicializando DOMUS...">
        <!-- Header Skeleton -->
        <header style="width: 100%; height: 60px; background-color: #ffffff; border-bottom: 1px solid #d9e5e3; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px);">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="domus-sk-pulse" style="width: 32px; height: 32px; border-radius: 10px; background-color: #16302e;"></div>
            <div class="domus-sk-pulse" style="width: 72px; height: 16px; border-radius: 6px; background-color: #d0dddb;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="domus-sk-pulse" style="width: 32px; height: 32px; border-radius: 10px; background-color: #e4f0ee;"></div>
            <div class="domus-sk-pulse" style="width: 34px; height: 34px; border-radius: 50%; background-color: #d0dddb;"></div>
          </div>
        </header>

        <!-- Main Body Content Skeleton -->
        <main style="flex: 1; padding: 16px; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
          <!-- Top Banner Skeleton -->
          <div style="background-color: #ffffff; border-radius: 20px; border: 1px solid #d9e5e3; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="domus-sk-pulse" style="width: 44px; height: 44px; border-radius: 14px; background-color: #ffca5e; opacity: 0.7;"></div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <div class="domus-sk-pulse" style="width: 140px; height: 18px; border-radius: 6px; background-color: #d0dddb;"></div>
                <div class="domus-sk-pulse" style="width: 90px; height: 12px; border-radius: 4px; background-color: #e4f0ee;"></div>
              </div>
            </div>
            <div class="domus-sk-pulse" style="width: 70px; height: 26px; border-radius: 9999px; background-color: #e4f0ee;"></div>
          </div>

          <!-- Section Cards Grid Skeleton -->
          <div style="background-color: #ffffff; border-radius: 20px; border: 1px solid #d9e5e3; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e4f0ee; padding-bottom: 12px;">
              <div class="domus-sk-pulse" style="width: 120px; height: 16px; border-radius: 6px; background-color: #d0dddb;"></div>
              <div class="domus-sk-pulse" style="width: 60px; height: 20px; border-radius: 8px; background-color: #e4f0ee;"></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 4px;">
              <div class="domus-sk-pulse" style="height: 90px; border-radius: 14px; background-color: #f0fcfa; border: 1px solid #e4f0ee;"></div>
              <div class="domus-sk-pulse" style="height: 90px; border-radius: 14px; background-color: #f0fcfa; border: 1px solid #e4f0ee;"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
