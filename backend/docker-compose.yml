services:
  postgres_db:
    image: postgres:16-alpine
    container_name: domus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-domus_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-domus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    container_name: domus_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    environment:
      PORT: ${PORT:-3333}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_db:5432/${POSTGRES_DB:-domus_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-domus-secret-key-change-in-production}
      HOUSEHOLD_CODE_SECRET: ${HOUSEHOLD_CODE_SECRET:-your-household-code-salt}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-248488236065-n5dela4vbnsh5kdfqke3n3ol4nedp7m2.apps.googleusercontent.com}
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist

volumes:
  postgres_data:
    driver: local
